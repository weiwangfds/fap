[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/gateway",
    "crates/agent",
    "crates/demo",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
fap-protocol = { path = "crates/protocol" }
fap-agent = { path = "crates/agent" }
fap-gateway = { path = "crates/gateway" }
